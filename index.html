<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Personal language learning OS — English, Spanish, German and French to C2.">
  <title>Lingua OS — Personal Language Learning OS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lingua OS">
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="no-shell">
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-inner" id="sidebar-inner"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main-wrap">
      <header class="topbar" id="topbar"></header>
      <main class="main" id="view" tabindex="-1"></main>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Quick navigation"></nav>
  </div>

  <div class="toast-region" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>
  <noscript><p style="padding:2rem">Lingua OS needs JavaScript enabled.</p></noscript>

  <!-- Third-party: official Supabase client (vendored by the build, no CDN) -->
  <script src="vendor/supabase.js"></script>
  <!-- Public runtime config generated by the build from environment variables -->
  <script src="js/env.js"></script>
  <!-- Core -->
  <script src="js/core.js"></script>
  <script src="js/config.js"></script>
  <!-- Language registry (single place where a language is declared) -->
  <script src="js/content/languages.js"></script>
  <!-- Content packs (one set of files per language) -->
  <script src="js/content/shared.js"></script>
  <script src="js/content/en.js"></script>
  <script src="js/content/en-pro.js"></script>
  <script src="js/content/en-med.js"></script>
  <script src="js/content/es.js"></script>
  <script src="js/content/es-pro.js"></script>
  <script src="js/content/es-med.js"></script>
  <script src="js/content/de.js"></script>
  <script src="js/content/de-lex.js"></script>
  <script src="js/content/de-pro.js"></script>
  <script src="js/content/de-med.js"></script>
  <script src="js/content/fr.js"></script>
  <script src="js/content/fr-lex.js"></script>
  <script src="js/content/fr-pro.js"></script>
  <script src="js/content/fr-med.js"></script>
  <script src="js/content/compare.js"></script>
  <script src="js/content/pathways.js"></script>
  <!-- State -->
  <script src="js/state/store.js"></script>
  <!-- Learning engine -->
  <script src="js/engine/srs.js"></script>
  <script src="js/engine/skills.js"></script>
  <script src="js/engine/learning.js"></script>
  <script src="js/engine/pedagogy.js"></script>
  <script src="js/engine/writing.js"></script>
  <script src="js/engine/assessment.js"></script>
  <script src="js/engine/planner.js"></script>
  <script src="js/engine/progress.js"></script>
  <script src="js/engine/speech.js"></script>
  <script src="js/ai.js"></script>
  <!-- Auth · Database · Sync -->
  <script src="js/auth/errors.js"></script>
  <script src="js/auth/auth.js"></script>
  <script src="js/data/mapper.js"></script>
  <script src="js/data/db.js"></script>
  <script src="js/sync/sync.js"></script>
  <!-- UI -->
  <script src="js/ui/components.js"></script>
  <script src="js/ui/runners.js"></script>
  <script src="js/ui/runners-ped.js"></script>
  <script src="js/ui/views-main.js"></script>
  <script src="js/ui/views-learn.js"></script>
  <script src="js/ui/views-pro.js"></script>
  <script src="js/ui/views-track.js"></script>
  <script src="js/ui/views-setup.js"></script>
  <script src="js/ui/views-lang.js"></script>
  <script src="js/ui/views-auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
